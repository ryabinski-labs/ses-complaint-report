<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SES Complaint Report — live</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="mask-icon" href="/favicon.svg" color="#2d8b8b">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* apply a saved theme before first paint so there is no flash */
try { const t = localStorage.getItem('sesreport-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Theme: Ocean Depths (theme-factory) — deep navy, teal, seafoam, cream.
   Web fonts: Instrument Serif (display) + IBM Plex Sans/Mono, replacing the theme's DejaVu Sans.
   Chart series --s1/--s2 were checked with the dataviz palette validator against --card, in both modes. */
:root { --bg:#121a26; --card:#1a2332; --card2:#223044; --line:#2c3b50; --grid:#243247;
  --ink:#f1faee; --ink2:#c9d6df; --mut:#8fa3b6;
  --acc:#2d8b8b; --acctx:#5cc6c6; --btn:#1f7373; --soft:#a8dadc;
  --s1:#14a3a8; --s2:#d9694b; --s0:#3d5068;
  --red:#e0533d; --redtx:#f07a62; --ok:#46d39a; --warn:#e8b04b;
  --glow:rgba(45,139,139,.16); --shadow:0 22px 48px -30px rgba(0,0,0,.95);
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ring:0 0 0 2px var(--bg), 0 0 0 4px var(--acctx); color-scheme:dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#f4f8f3; --card:#ffffff; --card2:#e9f0ee; --line:#d3dfdc; --grid:#e4ece9;
  --ink:#1a2332; --ink2:#34465a; --mut:#55697a;
  --acc:#2d8b8b; --acctx:#00666c; --btn:#1f7373; --soft:#2d8b8b;
  --s1:#008f96; --s2:#c4573a; --s0:#bccad3;
  --red:#c8402b; --redtx:#b3341f; --ok:#17663f; --warn:#8a5a00;
  --glow:rgba(45,139,139,.10); --shadow:0 18px 40px -30px rgba(26,35,50,.45); color-scheme:light; } }
:root[data-theme="light"] {
  --bg:#f4f8f3; --card:#ffffff; --card2:#e9f0ee; --line:#d3dfdc; --grid:#e4ece9;
  --ink:#1a2332; --ink2:#34465a; --mut:#55697a;
  --acc:#2d8b8b; --acctx:#00666c; --btn:#1f7373; --soft:#2d8b8b;
  --s1:#008f96; --s2:#c4573a; --s0:#bccad3;
  --red:#c8402b; --redtx:#b3341f; --ok:#17663f; --warn:#8a5a00;
  --glow:rgba(45,139,139,.10); --shadow:0 18px 40px -30px rgba(26,35,50,.45); color-scheme:light; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:72px; }
body { margin:0; color:var(--ink); font:15px/1.55 var(--sans); background:var(--bg);
  background-image:radial-gradient(1100px 520px at 78% -12%, var(--glow), transparent 62%),
    radial-gradient(700px 420px at -10% 0%, var(--glow), transparent 60%);
  background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.wrap { max-width:1240px; margin:0 auto; padding:28px 24px 90px; }
.skip { position:absolute; left:-999px; top:8px; background:var(--card); color:var(--ink); padding:8px 12px; border-radius:8px; z-index:50; }
.skip:focus { left:12px; }
h1 { font-family:var(--display); font-weight:400; font-size:42px; line-height:1.02; margin:0 0 4px; letter-spacing:-.3px; }
h1 em { font-style:italic; color:var(--acctx); }
h2 { font-family:var(--display); font-weight:400; font-size:30px; line-height:1.1; margin:0; letter-spacing:-.2px; }
h3 { font-size:13px; margin:26px 0 8px; color:var(--ink2); font-weight:600; letter-spacing:.2px; }
.eyebrow { font:500 11px/1 var(--mono); letter-spacing:1.4px; text-transform:uppercase; color:var(--acctx); }
.sechead { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:64px 0 18px; padding-bottom:12px; border-bottom:1px solid var(--line); }
.sechead .eyebrow { display:block; margin-bottom:8px; }
.sechead p { margin:6px 0 0; color:var(--mut); font-size:13.5px; max-width:640px; }
.ic { width:16px; height:16px; flex:0 0 auto; vertical-align:-3px; }
.sub { color:var(--mut); font-size:13px; }
.lede { color:var(--ink2); font-size:14px; max-width:760px; }
.tag { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
.tag .ic { width:12px; height:12px; vertical-align:0; }
.tag.ok { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
.tag.bad { background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--redtx); }
.tag.warn { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
.tag.info { background:color-mix(in srgb, var(--acc) 18%, transparent); color:var(--acctx); }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:2px; box-shadow:0 0 0 0 rgba(70,211,154,.5); animation:pulse 2.4s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(70,211,154,.5);} 70%{box-shadow:0 0 0 7px rgba(70,211,154,0);} 100%{box-shadow:0 0 0 0 rgba(70,211,154,0);} }
table { width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 4px; }
th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
th { color:var(--mut); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.55px; overflow-wrap:normal; }
th.num .thbtn { justify-content:flex-end; text-align:right; }
td:first-child { color:var(--ink); }
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { color:var(--ink); }
th .arrow { opacity:.6; font-size:10px; }
tr:hover td { background:var(--card2); }
.mono { font-family:var(--mono); font-size:12px; }
td.num, .num { font-variant-numeric:tabular-nums; }
td.num { text-align:right; }
.muted { color:var(--mut); }
.ok { color:var(--ok); } .bad { color:var(--redtx); } .warn { color:var(--warn); }
.box { position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin:14px 0; }
.box > h3:first-child { margin-top:0; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid2 > * { min-width:0; }
.grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
@media(max-width:900px){ .grid3{grid-template-columns:1fr;} }
@media(max-width:820px){ .grid2{grid-template-columns:1fr;} }
code { font-family:var(--mono); background:var(--card2); padding:1px 6px; border-radius:5px; font-size:12px; overflow-wrap:anywhere; }
a { color:var(--acctx); }
footer { margin-top:64px; color:var(--mut); font-size:12px; border-top:1px solid var(--line); padding-top:16px; }

/* --------------------------------------------------------------- header */
.topbar { display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; justify-content:space-between; }
.brand { display:flex; align-items:center; gap:14px; min-width:0; }
.brand .mark { width:46px; height:46px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center; color:var(--ink);
  background:linear-gradient(145deg, var(--acc), #1a4f5e); box-shadow:0 10px 24px -14px var(--acc); }
.brand .mark svg { width:22px; height:22px; color:#f1faee; }
.controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.topbar > .controls { margin-left:auto; }
button { display:inline-flex; align-items:center; gap:7px; background:var(--btn); color:#f1faee; border:0; border-radius:10px; padding:9px 15px; font-family:var(--sans); font-weight:600; font-size:13px; cursor:pointer; transition:filter .15s ease, transform .08s ease, background .15s ease; }
button:hover { filter:brightness(1.12); }
button:active { transform:translateY(1px); }
button:disabled { opacity:.5; cursor:default; }
button:focus-visible, .search:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline:none; box-shadow:var(--ring); }
button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
button.ghost:hover { filter:none; background:var(--card2); }
button.mini { padding:5px 10px; font-size:12px; font-weight:500; }
button.icon-only { padding:8px 9px; }
select.search { cursor:pointer; max-width:100%; }
.controls .pill { white-space:nowrap; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); flex-wrap:wrap; }
.seg button { max-width:100%; overflow-wrap:anywhere; text-align:left; background:transparent; color:var(--mut); border-radius:0; padding:6px 12px; font-weight:600; }
.seg button:hover { color:var(--ink); background:var(--card2); }
.seg button[aria-pressed="true"] { background:var(--card2); color:var(--ink); box-shadow:inset 0 -2px 0 var(--acc); }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--mut); border:1px solid var(--line); background:var(--card); border-radius:20px; padding:5px 11px; }
.pill.warn { color:var(--warn); }
.search { background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:7px 10px; font-size:13px; width:230px; font-family:var(--sans); transition:border-color .15s ease; }
.search::placeholder { color:var(--mut); }

/* sticky section nav */
.secnav { position:sticky; top:0; z-index:20; margin:22px -24px 0; padding:10px 24px; display:flex; flex-wrap:wrap; gap:4px;
  background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid transparent; transition:border-color .2s ease; }
.secnav.stuck { border-bottom-color:var(--line); }
.secnav a { flex:0 0 auto; text-decoration:none; color:var(--mut); font-size:12.5px; font-weight:500; padding:6px 12px; border-radius:20px; transition:color .15s ease, background .15s ease; }
.secnav a:hover { color:var(--ink); background:var(--card); }
.secnav a[aria-current="true"] { color:var(--ink); background:var(--card2); }
.secnav .alertcount { display:inline-grid; place-items:center; min-width:17px; height:17px; padding:0 5px; margin-left:5px; border-radius:9px; font-size:10.5px; font-weight:600; background:color-mix(in srgb, var(--warn) 22%, transparent); color:var(--warn); }

/* --------------------------------------------------------------- hero */
.hero { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:16px; margin-top:18px; }
@media(max-width:980px){ .hero{grid-template-columns:1fr;} }
.verdict { position:relative; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px 28px 24px; box-shadow:var(--shadow); }
.verdict::after { content:""; position:absolute; inset:auto -40px -120px auto; width:360px; height:260px; pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 100%, transparent 0 18px, color-mix(in srgb, var(--acc) 12%, transparent) 18px 19px); opacity:.7; }
.verdict .status { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; letter-spacing:.3px; padding:5px 11px 5px 9px; border-radius:20px; }
.verdict .status .ic { width:14px; height:14px; vertical-align:0; }
.verdict .status.ok { background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }
.verdict .status.warn { background:color-mix(in srgb, var(--warn) 15%, transparent); color:var(--warn); }
.verdict .status.bad { background:color-mix(in srgb, var(--red) 15%, transparent); color:var(--redtx); }
.verdict h2 { font-size:34px; margin:16px 0 18px; max-width:600px; }
.verdict h2 em { color:var(--acctx); }
.hero-fig { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.hero-fig .big { font:600 56px/1 var(--sans); letter-spacing:-1.8px; }
.hero-fig .big small { font-size:28px; letter-spacing:-.5px; font-weight:500; color:var(--ink2); margin-left:1px; }
.hero-fig .cap { color:var(--mut); font-size:13px; max-width:260px; }
.rail { position:relative; margin:30px 0 8px; }
.rail .track { position:relative; height:12px; border-radius:6px; overflow:hidden; display:flex; gap:2px; }
.rail .zone { height:100%; }
.rail .zone.z-ok { background:color-mix(in srgb, var(--s1) 26%, var(--card2)); }
.rail .zone.z-warn { background:color-mix(in srgb, var(--warn) 34%, var(--card2)); }
.rail .zone.z-bad { background:color-mix(in srgb, var(--red) 34%, var(--card2)); }
.rail .mk { position:absolute; top:6px; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; border:2px solid var(--card); background:var(--ink); }
.rail .mk.peak { background:var(--card); border:2.5px solid var(--warn); box-shadow:0 0 0 2px var(--card); }
.rail .mk-label { position:absolute; top:-22px; transform:translateX(-50%); font:600 12px/1 var(--sans); white-space:nowrap; color:var(--ink); }
.rail .mk-label::after { content:""; position:absolute; left:50%; top:16px; width:1px; height:6px; background:var(--ink2); }
.rail .ticks { position:relative; height:30px; margin-top:6px; font-size:11px; color:var(--mut); }
.rail .ticks > span { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; padding-top:6px; }
.rail .ticks > span::before { content:""; position:absolute; left:50%; top:0; width:1px; height:5px; background:var(--line); }
.rail .ticks > span.end { transform:translateX(-100%); }
.rail .ticks > span.end::before { left:auto; right:0; }
.rail .ticks > span.start { transform:none; }
.rail .ticks > span.start::before { left:0; }
.rail .ticks > span.before { transform:translateX(-100%); padding-right:6px; }
.rail .ticks > span.before::before { left:auto; right:0; }
.rail .ticks > span.after { transform:none; padding-left:6px; }
.rail .ticks > span.after::before { left:0; }
.legendrow { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--ink2); margin-top:2px; }
.legendrow .k { display:inline-flex; align-items:center; gap:7px; min-width:0; max-width:100%; overflow-wrap:anywhere; }
.legendrow .k > .sw, .legendrow .k > .ic { flex:0 0 auto; }
.sw { display:inline-block; width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
.sw.ring { border-radius:50%; background:transparent; border:2px solid var(--warn); }
.sw.disc { border-radius:50%; background:var(--ink); }
.sw.line { width:14px; height:2px; border-radius:1px; }
.tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-content:start; }
@media(max-width:520px){ .tiles{gap:8px;} .tile{padding:12px 12px 13px;} .tile .tv{font-size:21px;} .tile .tv .unit{font-size:11.5px;} .tile .spark{display:none;} .tile .tx{font-size:11px;} }
.tile { position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px 15px; min-width:0; transition:border-color .18s ease, transform .18s ease; }
.tile:hover { border-color:color-mix(in srgb, var(--acc) 55%, var(--line)); }
.tile .tl { color:var(--mut); font-size:12px; display:flex; align-items:center; gap:7px; }
.tile .tl .ic { width:14px; height:14px; vertical-align:0; color:var(--acctx); }
.tile .tv { font:600 26px/1.1 var(--sans); letter-spacing:-.7px; margin-top:8px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.tile .tv .unit { font-size:13px; font-weight:500; color:var(--mut); letter-spacing:0; }
.tile .tx { font-size:11.5px; color:var(--mut); margin-top:5px; }
.tile .spark { position:absolute; right:14px; top:14px; }
.tile.ok .tv { color:var(--ok); } .tile.bad .tv { color:var(--redtx); }
.delta { font:600 11.5px/1 var(--sans); letter-spacing:0; }
.meter { height:6px; border-radius:3px; background:color-mix(in srgb, var(--s1) 18%, var(--card2)); margin-top:10px; overflow:hidden; display:flex; gap:2px; }
.meter > i { display:block; height:100%; background:var(--s1); border-radius:3px; }
.meter > i.gap { background:color-mix(in srgb, var(--red) 55%, var(--card2)); }
.meter.warn > i:first-child { background:var(--warn); }
.meter.bad > i:first-child { background:var(--red); }

/* --------------------------------------------------------------- attention */
.attn { display:grid; gap:8px; margin-top:12px; }
.attn-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px 12px 16px; border-left:3px solid var(--line); }
.attn-item.sev-high { border-left-color:var(--red); }
.attn-item.sev-medium { border-left-color:var(--warn); }
.attn-item.sev-info { border-left-color:var(--acc); }
.attn-item .ai { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; }
.attn-item.sev-high .ai { color:var(--redtx); background:color-mix(in srgb, var(--red) 14%, transparent); }
.attn-item.sev-medium .ai { color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); }
.attn-item.sev-info .ai { color:var(--acctx); background:color-mix(in srgb, var(--acc) 16%, transparent); }
.attn-item .at { font-weight:600; font-size:13.5px; overflow-wrap:anywhere; }
.attn-item .ad { color:var(--mut); font-size:12.5px; margin-top:1px; overflow-wrap:anywhere; }
@media(max-width:640px){ .attn-item{grid-template-columns:auto minmax(0,1fr);} .attn-item > button{grid-column:2; justify-self:start;} }
.allclear { display:flex; align-items:center; gap:10px; color:var(--ok); }

/* --------------------------------------------------------------- change strip */
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:8px 12px; min-width:0; }
.chip .cl { color:var(--mut); font-size:11.5px; }
.chip .cv { font-weight:600; font-size:14px; margin-top:2px; }
details.more { margin-top:10px; }
details.more > summary { cursor:pointer; color:var(--acctx); font-size:12.5px; font-weight:500; list-style:none; display:inline-flex; align-items:center; gap:6px; border-radius:6px; }
details.more > summary::-webkit-details-marker { display:none; }
details.more > summary::before { content:"›"; display:inline-block; transition:transform .15s ease; font-size:15px; line-height:1; }
details.more[open] > summary::before { transform:rotate(90deg); }
.addrlist { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.addrlist span { font-family:var(--mono); font-size:11.5px; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; overflow-wrap:anywhere; }

/* --------------------------------------------------------------- charts */
.filterbar { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin:0 0 12px; }
.filterbar .lbl { font-size:12px; color:var(--mut); }
.chartcard { overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 16px 10px; position:relative; transition:opacity .2s ease; }
.chartcard .ch-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; padding:0 4px 6px; }
.chartcard .ch-title { font-weight:600; font-size:14px; }
.chartcard .ch-sub { color:var(--mut); font-size:12px; }
.chart-host { position:relative; width:100%; min-height:120px; }
.chart-host svg { display:block; overflow:visible; }
.chart-host svg:focus-visible { box-shadow:var(--ring); border-radius:8px; }
.c-s1 { fill:var(--s1); } .c-s2 { fill:var(--s2); } .c-s0 { fill:var(--s0); }
.k-s1 { stroke:var(--s1); } .c-wash { fill:var(--s1); opacity:.12; }
.k-grid { stroke:var(--grid); } .k-axis { stroke:var(--line); }
.k-red { stroke:var(--red); } .k-warn { stroke:var(--warn); } .k-ink { stroke:var(--ink2); }
.k-surf { stroke:var(--card); } .c-surf { fill:var(--card); } .c-ink { fill:var(--ink); }
.t-mut { fill:var(--mut); } .t-ink2 { fill:var(--ink2); } .t-ink { fill:var(--ink); }
.c-warnring { fill:var(--card); stroke:var(--warn); }
.halo { stroke:var(--card); stroke-width:4px; stroke-linejoin:round; paint-order:stroke; }
.hit { fill:transparent; cursor:crosshair; }
.bar-mark { transition:opacity .12s ease; }
.statnote { display:flex; gap:22px; flex-wrap:wrap; padding:8px 4px 4px; font-size:12.5px; color:var(--mut); }
.statnote b { color:var(--ink); font-weight:600; }
.tip { position:fixed; z-index:60; pointer-events:none; background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:12px; box-shadow:0 14px 36px -12px rgba(0,0,0,.6); max-width:280px; opacity:0; transform:translateY(4px); transition:opacity .1s ease, transform .1s ease; }
.tip.show { opacity:1; transform:none; }
.tip .tt { color:var(--mut); font-size:11.5px; }
.tip .tv { font-weight:600; font-size:14px; margin:1px 0; }

<script>

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k?.nodeType ? k : document.createTextNode(k));

};
const fmtInt = n => (n===null||n===undefined) ? '—' : Number(n).toLocaleString('en-US');
const fmtPct = (x, d=4) => (x===null||x===undefined) ? '—' : (x*100).toFixed(d) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 86400000;
const T = d => Date.parse(String(d).slice(0,10) + 'T00:00:00Z');
const isoDay = t => new Date(t).toISOString().slice(0,10);
const plural = (n, one, many) => `${n} ${n===1?one:(many||one+'s')}`;
function fmtTs(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString('en-US', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtDate(day) {
  if (!day) return '—';
  const t = T(day);
  return isNaN(t) ? esc(day) : new Date(t).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', timeZone:'UTC'});
}
function relDays(day) {
  if (!day || isNaN(T(day))) return 'no date';
  const n = Math.round((T(day) - T(isoDay(Date.now()))) / DAY);
  if (n === 0) return 'today';
  return n > 0 ? `in ${plural(n,'day')}` : `${plural(-n,'day')} ago`;
}

/* ------------------------------------------------------------------- icons */
const ICONS = {

  users: '<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M17.5 20a5.5 5.5 0 0 0-2.3-4.5"/>',
  database: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  route: '<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 17.5h5a3 3 0 0 0 3-3V8.4"/>',
  server: '<rect x="3.5" y="4" width="17" height="6" rx="2"/><rect x="3.5" y="14" width="17" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  alert: '<path d="M12 4l8.5 15H3.5z"/><path d="M12 10v4M12 17h.01"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-.6 3"/><path d="M20 5v6h-6"/>',
  check: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9"/>',
  tick: '<path d="M5.5 12.5l4 4 9-9.5"/>',
  cross: '<path d="M7 7l10 10M17 7L7 17"/>',
  minus: '<path d="M7 12h10"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  flame: '<path d="M12 3c3 4 5 6 5 9a5 5 0 0 1-10 0c0-1.6.8-2.9 1.8-4 .3 1.2 1 2 2 2.2C10 8 10.5 5.5 12 3z"/>',
  wave: '<path d="M3 9c2.2 0 2.2-2 4.5-2S9.8 9 12 9s2.2-2 4.5-2S18.8 9 21 9"/><path d="M3 15c2.2 0 2.2-2 4.5-2s2.3 2 4.5 2 2.2-2 4.5-2 2.3 2 4.5 2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  flask: '<path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',

function icon(name, cls='') {
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`;

function sechead(id, eyebrow, title, desc='', right='') {

}
function tag(text, kind, ic=''){ return `<span class="tag ${kind}">${ic?icon(ic):''}${esc(text)}</span>`; }
const tipAttrs = (title, value, sub='') => `data-tt="${esc(title)}" data-tv="${esc(value)}"${sub?` data-ts="${esc(sub)}"`:''}`;

/* ------------------------------------------------------------ change / diff */
function prevSnapshot() {
  const h = state.history || [];
  return h.length >= 2 ? h[h.length - 2] : null;
}
function curSnapshot() {
  const h = state.history || [];
  return h.length ? h[h.length - 1] : null;
}
// up = worse for every tracked number, so a rise is coloured bad and a fall ok; the arrow keeps it readable without colour
function dnum(cur, prev) {
  if (cur == null || prev == null) return '';
  const x = cur - prev;
  if (x === 0) return ' <span class="delta muted" title="unchanged since last refresh">±0</span>';
  const cls = x > 0 ? 'bad' : 'ok';
  return ` <span class="delta ${cls}" title="since last refresh">${x > 0 ? '▲ +' : '▼ '}${x}</span>`;
}
function dpp(cur, prev) {
  if (cur == null || prev == null) return '';
  const x = (cur - prev) * 100;
  if (Math.abs(x) < 0.00005) return ' <span class="delta muted">±0</span>';
  const cls = x > 0 ? 'bad' : 'ok';
  return ` <span class="delta ${cls}" title="since last refresh">${x > 0 ? '▲ +' : '▼ '}${x.toFixed(4)} pp</span>`;
}
function sparkline(values, {w=120, h=30}={}) {
  const vals = values.filter(v => v != null);
  if (vals.length < 2) return '<span class="muted">not enough history yet</span>';
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*(w-8)+4, h-5-((v-min)/span)*(h-10)]);
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle" aria-hidden="true">
    <polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" class="k-s1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

// 12 monthly columns; the current month in the accent, the rest de-emphasised
function monthSpark(days) {
  const now = new Date(), buckets = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - i, 1));
    buckets.push({key: d.toISOString().slice(0,7), n: 0});
  }
  const idx = Object.fromEntries(buckets.map((b,i)=>[b.key,i]));

  const bars = buckets.map((b,i)=>{
    const bh = b.n ? Math.max(3, (b.n/max)*(h-2)) : 1.5;
    return `<rect x="${i*(bw+2)}" y="${(h-bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="1.5" class="${i===11?'c-s1':'c-s0'}"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${bars}</svg>`;
}

/* ------------------------------------------------------------------ export */
function copyText(text, label='Copied to clipboard') {

}
function download(name, text, mime='application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; a.click();

function toCsv(rows, columns) {
  // a leading = + - @ tab or CR makes spreadsheets evaluate the cell; prefix ' so it stays text
  const esc2 = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const head = columns.map(c=>esc2(c.title)).join(',');
  const body = rows.map(r=>columns.map(c=>esc2(c.value ? c.value(r) : r[c.key])).join(',')).join('\n');
  return head + '\n' + body;
}
function buildMarkdown() {

  L.push(`- Peak rolling rate: **${met.peak_rate?fmtPct(met.peak_rate.rate)+' ('+met.peak_rate.date+')':'—'}** vs AWS review line 0.10%`);

  else L.push('- none');

  L.push('');

  L.push(`- CloudWatch recorded: **${att.cloudwatch_recorded ?? '—'}** · attributed recipient records: **${att.records ?? '—'}** (real **${att.real_records ?? '—'}**, mailbox-simulator **${att.simulator_records ?? '—'}**)`);
  for (const r of (m.complaint_records||[])) L.push(`- \`${r.email}\` — ${r.store}${r.detail?` · ${r.detail}`:''}${r.simulator?' **(simulator/test)**':''}`);
  L.push('');

    L.push('');

  L.push(`_Read-only audit · generated by ses-complaint-report_`);

}

function fixCommand(cs) {
  const dest = JSON.stringify({
    Enabled: true,
    Name: "feedback-to-cloudwatch",
    MatchingEventTypes: ["BOUNCE", "COMPLAINT"],
    CloudWatchDestination: {
      DimensionConfigurations: [
        { DimensionName: "ses:configuration-set", DimensionValueSource: "messageTag", DefaultDimensionValue: cs },
      ],
    },
  }, null, 0);
  const shq = v => `'${String(v).replace(/'/g, `'\\''`)}'`;
  return `aws sesv2 create-configuration-set-event-destination \\
  --configuration-set-name ${shq(cs)} \\
  --event-destination ${shq(dest)}`;
}
// Every Fix button copies an agent-ready Markdown brief. Briefs come from the
// server-side Advisor (model.advisor.findings[].brief); a routing gap the
// Advisor did not cover falls back to a brief built here in the same shape.
const BRIEFS = new Map();
function registerBrief(id, resource, md) { BRIEFS.set(id, {resource, md}); return id; }
function routingBriefJs(cs) {
  return `# Fix: route BOUNCE/COMPLAINT events for ${cs}\n\n## Problem\nConfiguration set \`${cs}\` has no event destination for BOUNCE or COMPLAINT events.\n\n## Affected resource\n\`SES configuration set ${cs}\`\n\n## Why it matters\nComplaints sent through this path never reach the feedback handler. SES still suppresses the address at account level.\n\n## Steps\n1. Add a CloudWatch event destination that matches BOUNCE and COMPLAINT.\n\n## Commands\n\`\`\`sh\n${fixCommand(cs)}\n\`\`\`\n\n## Verify\n- The coverage grid shows ticks for BOUNCE and COMPLAINT after the next refresh.\n\n## Rollback\n- Delete the event destination created above.\n`;
}
function copyFix(id) {
  const b = BRIEFS.get(id);
  if (!b) return toast('No fix brief available for this item');
  copyText(b.md, `Fix brief for ${b.resource} copied as Markdown`);
}
const fixButton = (id, label='Copy fix') =>
  `<button class="ghost mini" type="button" data-fix="${esc(id)}" title="Copy a Markdown fix brief (problem, steps, commands, verify, rollback) for an agent to implement">${icon('copy')} ${label}</button>`;
function routingFixId(cs) {
  const f = (state.model.advisor?.findings || []).find(x => x.kind === 'routing' && x.resource === cs);
  return f ? registerBrief(f.id, f.resource, f.brief) : registerBrief(`routing:${cs}`, cs, routingBriefJs(cs));

const KIND_ICON = {dkim:'shield', mail_from:'route', spf:'shield', dmarc:'shield', routing:'route', publishing:'activity',
  identity_delivery:'server', complaint_rate:'alert', bounce_rate:'alert'};

/* ------------------------------------------------------------------ tooltip */
const tipEl = () => document.getElementById('tip');
function showTip(x, y, title, value, sub, rows=[]) {
  const t = tipEl();
  t.replaceChildren();
  if (title) t.append(el('div', {class:'tt'}, title));
  if (value) t.append(el('div', {class:'tv'}, value));
  if (sub) t.append(el('div', {class:'ts'}, sub));
  for (const r of rows) {
    const row = el('div', {class:'row'});
    const key = el('i'); key.style.background = r.color; row.append(key, el('span', {}, r.text));
    t.append(row);
  }
  t.classList.add('show');
  const w = t.offsetWidth, h = t.offsetHeight, vw = window.innerWidth;
  let lx = x + 14, ly = y - h - 12;
  if (lx + w > vw - 8) lx = x - w - 14;
  if (lx < 8) lx = 8;
  if (ly < 8) ly = y + 18;
  t.style.left = lx + 'px'; t.style.top = ly + 'px';
}
function hideTip() { tipEl().classList.remove('show'); }
function tipFromNode(n, x, y) { showTip(x, y, n.dataset.tt, n.dataset.tv, n.dataset.ts); }
document.addEventListener('pointerover', e => {
  const n = e.target.closest?.('[data-tt]'); if (!n) return;
  tipFromNode(n, e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => {
  const n = e.target.closest?.('[data-tt]'); if (n) tipFromNode(n, e.clientX, e.clientY);
});
document.addEventListener('pointerout', e => { if (e.target.closest?.('[data-tt]')) hideTip(); });
document.addEventListener('focusin', e => {
  const n = e.target.closest?.('[data-tt]'); if (!n) return;
  const r = n.getBoundingClientRect(); tipFromNode(n, r.left + r.width/2, r.top);
});
document.addEventListener('focusout', e => { if (e.target.closest?.('[data-tt]')) hideTip(); });
document.addEventListener('click', e => {
  const fix = e.target.closest?.('[data-fix]'); if (fix) { copyFix(fix.dataset.fix); return; }
  const rng = e.target.closest?.('[data-range]'); if (rng) { setRange(rng.dataset.range); return; }
  const src = e.target.closest?.('[data-source]'); if (src) { setSource(src.dataset.source); return; }
});

/* ------------------------------------------------------------------ tables */
function makeTable({columns, rows, search=true, height=null, filters=[], csv=null, csvColumns=null}) {
  const root = el('div');
  let q = '', sortKey = null, sortDir = 1, lastData = rows;
  const fstate = {};
  const bar = el('div', {class:'controls', style:'margin:8px 0'});
  if (search) {
    const inp = el('input', {class:'search', type:'search', placeholder:'Search…', 'aria-label':'Search table', oninput:e=>{q=e.target.value.toLowerCase(); draw();}});
    bar.append(inp);
  }
  for (const f of filters) {
    const sel = el('select', {class:'search', style:'width:auto', 'aria-label':f.label, onchange:e=>{fstate[f.key]=e.target.value; draw();}});
    sel.append(el('option',{value:''}, f.label));
    const vals = [...new Set(rows.map(r=>f.value(r)).filter(v=>v!==undefined&&v!==null&&v!==''))].sort();
    for (const v of vals) sel.append(el('option',{value:v}, v));
    bar.append(sel);
  }
  const sortSel = el('select', {class:'search selsort', style:'width:auto', 'aria-label':'Sort table', onchange:e=>{
    sortKey = e.target.value || null; sortDir = 1; draw();
  }});
  sortSel.append(el('option', {value:''}, 'Sort: default'));
  for (const c of columns) sortSel.append(el('option', {value:c.key}, `Sort by ${c.title}`));
  const dirBtn = el('button', {class:'ghost mini selsort', type:'button', 'aria-label':'Toggle sort direction', disabled:true, onclick:()=>{ if(sortKey){ sortDir*=-1; draw(); } }}, '▲');
  bar.append(sortSel, dirBtn);
  const csvBtn = el('button', {class:'ghost mini', type:'button', onclick:()=>{
    const name = (csv || columns[0].title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    download(`ses-${name}.csv`, toCsv(lastData, csvColumns || columns.filter(c=>c.key!=='fix')), 'text/csv');
  }}, '⤓ CSV');
  bar.append(csvBtn);
  const box = el('div', {class:'tablebox'});
  const wrap = el('div', {class:'tablewrap', tabindex:'0', role:'group', 'aria-label':'Scrollable table', style: height?`max-height:${height}px`:''});
  const fade = el('div', {class:'scrollfade', 'aria-hidden':'true'});
  const tbl = el('table');
  const thead = el('thead'), trh = el('tr');
  for (const c of columns) {
    const th = el('th', {class:'sortable' + (/\bnum\b/.test(c.cls||'') ? ' num' : '')});
    const btn = el('button', {type:'button', class:'thbtn', 'aria-label':`Sort by ${c.title}`, html:`${esc(c.title)} <span class="arrow"></span>`});
    if (c.hint) btn.title = c.hint;
    btn.addEventListener('click', ()=>{ if(sortKey===c.key) sortDir*=-1; else {sortKey=c.key; sortDir=1;} draw(); });
    th.append(btn);
    c._th = th; trh.append(th);
  }
  thead.append(trh); tbl.append(thead);
  const tbody = el('tbody'); tbl.append(tbody);
  wrap.append(tbl); box.append(wrap, fade); root.append(bar, box);
  const count = el('div',{class:'sub',style:'margin-top:6px'});

  function syncScroll() {
    const max = wrap.scrollWidth - wrap.clientWidth;
    const scrollable = max > 1;
    const atEnd = wrap.scrollLeft >= max - 1;
    wrap.classList.toggle('scrolled-x', scrollable && wrap.scrollLeft > 1);
    box.classList.toggle('more-right', scrollable && !atEnd);
    wrap.tabIndex = scrollable ? 0 : -1;
    wrap.setAttribute('aria-label', scrollable ? 'Scrollable table — use arrow keys to scroll' : 'Table');
    fade.style.right = Math.max(1, (wrap.offsetWidth - wrap.clientWidth) - 1) + 'px';
  }
  wrap.addEventListener('scroll', syncScroll, {passive:true});
  if (window.ResizeObserver) new ResizeObserver(syncScroll).observe(wrap);
  document.fonts?.ready?.then(syncScroll);

  function draw() {
    let data = rows.slice();
    if (q) data = data.filter(r => columns.some(c => {
      const v = c.searchValue ? c.searchValue(r) : (c.render ? c.render(r) : (r[c.key] ?? ''));
      return String(v).replace(/<[^>]*>/g, ' ').toLowerCase().includes(q);
    }));
    for (const f of filters) if (fstate[f.key] !== '' && fstate[f.key] !== undefined) data = data.filter(r => String(f.value(r)) === fstate[f.key]);
    if (sortKey) {
      const c = columns.find(c=>c.key===sortKey);
      data.sort((a,b)=>{ let x = c && c.sortValue ? c.sortValue(a) : a[sortKey];
        let y = c && c.sortValue ? c.sortValue(b) : b[sortKey];
        if (c && c.type==='num') { x=Number(x)||0; y=Number(y)||0; return (x-y)*sortDir; }
        return String(x??'').localeCompare(String(y??''))*sortDir; });
    }
    tbody.innerHTML = '';
    for (const r of data) {
      const tr = el('tr');
      for (const c of columns) {
        const td = el('td', {class:c.cls||''});
        td.dataset.label = c.title;
        const v = c.render ? c.render(r) : (r[c.key] ?? '');
        // only render() may return markup (it escapes its own values); raw fields are always text
        if (v && v.nodeType) td.append(v); else if (c.render) td.innerHTML = v===null||v===undefined?'':String(v); else td.textContent = v===null||v===undefined?'':String(v);
        tr.append(td);
      }
      tbody.append(tr);
    }
    columns.forEach(c=>{ const a=c._th.querySelector('.arrow'); a.textContent = sortKey===c.key ? (sortDir>0?'▲':'▼') : '';
      if (sortKey===c.key) c._th.setAttribute('aria-sort', sortDir>0?'ascending':'descending'); else c._th.removeAttribute('aria-sort'); });
    sortSel.value = sortKey || '';
    dirBtn.disabled = !sortKey;
    dirBtn.title = sortKey ? `Sort direction: ${sortDir > 0 ? 'ascending' : 'descending'}` : 'Pick a sort column first';
    dirBtn.textContent = sortDir > 0 ? '▲' : '▼';
    lastData = data;
    count.textContent = `${data.length} row${data.length===1?'':'s'}${data.length!==rows.length?` (of ${rows.length})`:''}`;
    syncScroll();
  }
  root.append(count);
  draw();
  return root;
}

/* ------------------------------------------------------------------ derived numbers */
function thresholds() {
  const met = state.model.metrics;
  return { review: met.aws_review_line || 0.001, alert: met.alert_line || 0.0009 };
}
function rateLevel(rate) {
  const {review, alert} = thresholds();
  if (rate == null) return 'ok';
  return rate >= review ? 'bad' : rate >= alert ? 'warn' : 'ok';
}
function unattributedByConfigSet() {
  const m = state.model;
  const tagged = (m.config_set_complaints||[]).reduce((a,c)=>a+(c.events||0), 0);
  return Math.max(0, (m.metrics.total_complaints||0) - tagged);
}

/* ------------------------------------------------------------------ overview: verdict + tiles */
function renderHero() {
  const m = state.model, met = m.metrics, p = m.posture;
  const {review, alert} = thresholds();
  const latest = met.latest_rate?.rate, peak = met.peak_rate?.rate;
  const enf = p.enforcement_status || 'UNKNOWN';
  const level = enf !== 'HEALTHY' ? 'bad' : rateLevel(latest);
  const pctOf = latest != null ? Math.round(latest / review * 100) : null;
  const status = level === 'ok' ? ['Healthy', 'check'] : level === 'warn' ? ['Watch closely', 'alert'] : ['At risk', 'alert'];
  const headline = enf !== 'HEALTHY'
    ? `AWS enforcement status is <em>${esc(enf)}</em>. Sending reputation needs attention now.`
    : latest == null ? 'No rolling complaint rate was published for this window.'
    : level === 'ok' ? `The rolling complaint rate sits at <em>${pctOf}%</em> of AWS's review line.`
    : level === 'warn' ? `The rolling complaint rate is past the internal alert line, at <em>${pctOf}%</em> of AWS's review line.`
    : `The rolling complaint rate is <em>over</em> AWS's review line (${pctOf}%).`;
  const per = met.total_complaints ? Math.round(met.total_sends / met.total_complaints) : null;

  // threshold rail: zones split at the alert and review lines, latest as a disc, peak as a ring
  const max = Math.max(review * 1.4, (peak || 0) * 1.05, (latest || 0) * 1.05);
  const pos = v => Math.min(100, Math.max(0, v / max * 100));
  const zone = (cls, a, b, label) => `<span class="zone ${cls}" style="flex:0 0 calc(${(pos(b)-pos(a)).toFixed(3)}% - 2px)" ${tipAttrs(label, `${fmtPct(a,2)} – ${fmtPct(b,2)}`)} tabindex="-1"></span>`;
  const rail = latest == null ? '' : `<div class="rail" role="img" aria-label="Latest rolling complaint rate ${fmtPct(latest)}, peak ${fmtPct(peak)}; alert line ${fmtPct(alert,2)}, AWS review line ${fmtPct(review,2)}">
      <div class="mk-label" style="left:${pos(latest).toFixed(2)}%;${pos(latest)<14?'transform:translateX(-12px)':pos(latest)>86?'transform:translateX(calc(-100% + 12px))':''}">Latest ${fmtPct(latest)}</div>
      <div class="track">${zone('z-ok',0,alert,'Below internal alert line')}${zone('z-warn',alert,review,'Internal alert band')}${zone('z-bad',review,max,'Above AWS review line')}</div>
      ${peak!=null?`<span class="mk peak" style="left:${pos(peak).toFixed(2)}%" ${tipAttrs('Peak rolling rate', fmtPct(peak), met.peak_rate.date)}></span>`:''}
      <span class="mk" style="left:${pos(latest).toFixed(2)}%" ${tipAttrs('Latest rolling rate', fmtPct(latest), met.latest_rate.date)}></span>
      <div class="ticks"><span class="start" style="left:0">0%</span><span class="before" style="left:${pos(alert)}%">alert ${fmtPct(alert,2)}</span><span class="after" style="left:${pos(review)}%">AWS<span class="wide"> review</span> ${fmtPct(review,2)}</span></div>
    </div>
    <div class="legendrow">
      <span class="k"><span class="sw disc"></span>Latest ${fmtPct(latest)} · ${fmtDate(met.latest_rate.date)}</span>
      ${peak!=null?`<span class="k"><span class="sw ring"></span>Peak ${fmtPct(peak)} · ${fmtDate(met.peak_rate.date)} (${Math.round(peak/review*100)}% of line)</span>`:''}
    </div>`;

  return `<section class="hero reveal" id="overview" aria-label="Overview">
    <div class="verdict">
      <span class="status ${level}">${icon(status[1])}${status[0]} · enforcement ${esc(enf)}</span>
      <h2>${headline}</h2>
      <div class="hero-fig">
        <div class="big">${latest!=null?(latest*100).toFixed(4):'—'}<small>%</small></div>
        <div class="cap">rolling complaint rate (<code>Reputation.ComplaintRate</code>)${per?` · about 1 complaint per ${fmtInt(per)} messages overall`:''}</div>
      </div>
      ${rail}
    </div>
    ${renderTiles()}
  </section>`;
}

function tile({label, value, unit='', sub='', ic='', cls='', extra='', spark=''}) {

    ${tile({label:'Complaint-flagged accounts', ic:'users', value:fmtInt(m.complainants.length),

/* ------------------------------------------------------------------ needs attention */
function attentionItems() {
  const m = state.model, met = m.metrics, items = [];
  const {review, alert} = thresholds();
  if (m.posture.enforcement_status && m.posture.enforcement_status !== 'HEALTHY')

/* ------------------------------------------------------------------ trend (rate + daily complaints, shared time axis) */
function rangeDays() { return state.range==='all' ? Infinity : Number(state.range); }
function addExpiry(d) {
  const rd = state.model.retention?.cloudwatch_days || state.model.metrics.window?.days || 455;
  return {...d, expires: d.expires || isoDay(T(d.date) + rd*DAY)};
}
function trendData() {
  const met = state.model.metrics, cs = state.model.config_set_complaints || [];
  const cut = rangeDays(), now = Date.now();
  const inR = d => cut===Infinity || (now - T(d))/DAY <= cut;
  const rate = (met.rate_series||[]).filter(p=>p.rate!=null && inR(p.date)).sort((a,b)=>T(a.date)-T(b.date));
  const src = state.source==='all' ? (met.complaints_by_day||[]) : ((cs.find(c=>c.config_set===state.source)||{}).days||[]);
  const days = src.filter(d=>inR(d.date)).map(addExpiry);
  const ts = [...rate.map(p=>T(p.date)), ...days.map(d=>T(d.date))];
  if (!ts.length) return {rate, days, from:null, to:null};
  const from = cut===Infinity ? Math.min(...ts) : Math.min(now - cut*DAY, ...ts);

}

    const out = [], d0 = new Date(from);
    let t = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate() + ((8 - d0.getUTCDay()) % 7 || 7));
    for (let i = 0; t <= to; t += 7*DAY, i++) if (i % k === 0)
      out.push({x: xs(t), label: new Date(t).toLocaleDateString('en-US', {month:'short', day:'numeric', timeZone:'UTC'})});
    return out;

function drawTrend() {

    g += `<text x="${padL-8}" y="${(y1(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" class="t-mut" style="font-variant-numeric:tabular-nums">${pctTick(v)}</text>`;

  // thresholds (labels in the right gutter, ink text beside a coloured rule)
  for (const [v, cls, label] of [[review,'k-red',(narrow?'AWS ':'AWS review ')+pctTick(review)],[alert,'k-warn',narrow?'Alert':'Alert '+pctTick(alert)]]) {
    g += `<line x1="${padL}" x2="${W-padR}" y1="${y1(v).toFixed(1)}" y2="${y1(v).toFixed(1)}" class="${cls}" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    g += `<text x="${W-padR+8}" y="${(y1(v)+ (cls==='k-red'?-1:9)).toFixed(1)}" font-size="10.5" class="t-ink2">${label}</text>`;

    g += `<text x="${px.toFixed(1)}" y="${(py-11).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="600" class="t-ink halo">peak ${fmtPct(pk.rate)}</text>`;

  svg.addEventListener('keydown', e => {
    const jump = {ArrowLeft:-1, ArrowRight:1, PageUp:-7, PageDown:7}[e.key];
    if (jump) { e.preventDefault(); show((cur < 0 ? stops.length - 1 : cur) + jump); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(stops.length - 1); }
    else if (e.key === 'Escape') clear();
  });
  svg.addEventListener('blur', clear);
}

function rateCell(v, line) {

/* ------------------------------------------------------------------ coverage */
function coverageRows() {
  const m = state.model, cov = m.suppression_coverage || [], sets = m.config_sets || [];
  const byName = new Map();
  for (const c of sets) byName.set(c.name, {name:c.name, types:c.event_types||[], routes:!!c.forwards_feedback});
  for (const c of cov) {
    const r = byName.get(c.config_set) || {name:c.config_set, types:c.event_types||[], routes:!!c.routes_feedback};
    Object.assign(r, {risk:c.risk, sends:c.sends, complaints:c.complaints, routes:!!c.routes_feedback});
    if (!r.types.length && c.event_types) r.types = c.event_types;
    byName.set(c.config_set, r);
  }
  const rank = {high:0, medium:1, ok:2};
  for (const r of byName.values()) if (!r.risk) r.risk = r.routes ? 'ok' : 'medium';
  return [...byName.values()].sort((a,b)=>(rank[a.risk]??3)-(rank[b.risk]??3) || a.name.localeCompare(b.name));
}
function renderCoverage() {
  const m = state.model, rows = coverageRows();
  const crit = ['BOUNCE','COMPLAINT'];
  const extra = [...new Set(['DELIVERY','OPEN','CLICK', ...rows.flatMap(r=>r.types)].filter(t=>!crit.includes(t)))].sort();
  const cols = [...crit, ...extra];
  const cell = (has, critical) => has ? `<span class="mx y" title="routed">${icon('tick')}<span class="sr">routed</span></span>`
    : critical ? `<span class="mx n" title="not routed">${icon('cross')}<span class="sr">not routed</span></span>`
    : `<span class="mx o">${icon('minus')}<span class="sr">not routed</span></span>`;
  const risk = r => r.risk==='high' ? tag('high','bad','alert') : r.risk==='medium' ? tag('medium','warn','alert') : r.risk==='ok' ? tag('ok','ok','check') : '<span class="muted">—</span>';
  const matrix = `<div class="matrixwrap"><table class="matrix">
    <thead><tr><th>Configuration set</th>${cols.map(c=>`<th class="${crit.includes(c)?'crit':''}">${esc(c)}</th>`).join('')}<th>Sends</th><th>Complaints</th><th>Risk</th><th><span class="sr">Fix</span></th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.name)}</td>${cols.map(c=>`<td data-label="${esc(c)}">${cell(r.types.includes(c), crit.includes(c))}</td>`).join('')}
      <td class="num" data-label="Sends">${r.sends==null?'<span class="muted">—</span>':fmtInt(r.sends)}</td><td class="num" data-label="Complaints">${r.complaints==null?'—':fmtInt(r.complaints)}</td>
      <td>${risk(r)}</td><td class="fixcell">${r.routes?'':fixButton(routingFixId(r.name),'Fix')}</td></tr>`).join('')}</tbody></table></div>`;

  // pipeline: send → event destinations → SNS → handler → stores
  const fwd = m.config_sets.filter(c=>c.forwards_feedback).length;
  const idfb = m.identity_feedback || [];
  const subs = (m.sns_topics||[]).flatMap(t=>t.subscribers||[]).filter(s=>s.protocol==='lambda'||s.protocol==='https');
  const q = m.complaint_queue;
  const node = (k, v, d, gap=false) => `<div class="node${gap?' gap':''}" role="listitem"><div class="nk">${k}</div><div class="nv">${v}</div><div class="nd">${d}</div></div>`;
  const flow = `<div class="flow" role="list" aria-label="Complaint feedback pipeline">
    ${node('1 · Send', `${m.config_sets.length} config sets`, `${(m.identities?.rows||[]).length} identities in ${esc(m.meta.region)}`)}
    ${node('2 · Route', `${fwd} / ${m.config_sets.length} route feedback`, `${plural(idfb.length,'identity','identities')} also route${idfb.length===1?'s':''} through ${idfb.length===1?'its':'their'} own topic`, fwd < m.config_sets.length)}
    ${node('3 · Notify', `${plural((m.sns_topics||[]).length,'SNS topic')}`, `${plural(subs.length,'handler subscription')}`)}
    ${node('4 · Handle', subs.length?'Feedback handler':'No handler', subs.length?esc(subs.map(s=>s.endpoint.split(':').pop()).join(', ')):'nothing subscribed', !subs.length)}
    ${node('5 · Retain', `${plural((m.stores||[]).length,'store')}`, q?`DLQ <code>${esc(q.name)}</code>: ${q.visible} visible`:'no DLQ found', q && q.visible > 0)}
  </div>`;
  const sup = (m.posture.suppressed_reasons||[]);
  return `${flow}
    <p class="sub" style="margin-top:12px">${sup.length?`SES suppresses <code>${sup.map(esc).join('</code> and <code>')}</code> addresses for <em>every</em> config set at account level. A routing gap means your app never hears about the complaint. It does not stop the suppression.`:'<span class="bad">Account-level suppression is off, so recipients are NOT suppressed automatically when they complain.</span>'}</p>
    <h3>Which config sets route each event type</h3>
    ${matrix}
    <details class="more" style="margin-top:12px"><summary>Destinations, identity topics and SNS subscribers</summary>
      <h3>Configuration sets and where their feedback goes</h3><div id="csTable"></div>
      <h3>Identity-level Bounce/Complaint topics</h3>
      <p class="sub">Sending identities that route feedback through their own SNS topic. These catch complaints for sends with no configuration set.</p>
      <div id="idfbTable"></div>
      <h3>SNS feedback / ops topics and subscribers</h3><div id="snsTable"></div>
    </details>`;
}

function renderAuthGrid() {
  const checks = state.model.advisor?.checks || {};
  const doms = Object.keys(checks).sort();
  if (!doms.length) return '';
  const cell = (v, label) => {
    const ok = v === 'pass';
    const dns = String(v||'').startsWith('not checked');
    const cls = ok ? 'y' : dns ? 'o' : 'n';
    const ic = ok ? 'tick' : dns ? 'minus' : 'cross';
    return `<td data-label="${label}"><span class="mx ${cls}" title="${esc(v)}">${icon(ic)}<span class="sr">${esc(v)}</span></span>${ok?'':` <span class="cell-sub" style="display:inline">${esc(v)}</span>`}</td>`;
  };
  const failing = doms.filter(d => ['dkim','spf','dmarc'].some(k => checks[d][k] && checks[d][k] !== 'pass'));
  const row = d => `<tr><td class="mono">${esc(d)}</td>${cell(checks[d].dkim,'DKIM')}${cell(checks[d].spf,'SPF')}${cell(checks[d].dmarc,'DMARC')}<td data-label="MAIL FROM" class="mono">${esc(checks[d].mail_from||'—')}</td></tr>`;
  return `<div class="box"><h3 style="margin-top:0">Authentication · ${plural(doms.length,'sending domain')}</h3>
    <p class="sub" style="margin-top:0">DKIM from SES; SPF (custom MAIL FROM) and DMARC from public DNS. ${failing.length ? `${plural(failing.length,'domain')} need attention.` : 'All domains pass.'}</p>
    <details class="more" ${failing.length && failing.length <= 8 ? 'open' : ''}><summary>Show the authentication grid</summary>
    <div class="matrixwrap" style="margin-top:10px"><table class="matrix auth">
      <thead><tr><th>Domain</th><th>DKIM</th><th>SPF</th><th>DMARC</th><th>MAIL FROM</th></tr></thead>
      <tbody>${[...failing, ...doms.filter(d=>!failing.includes(d))].map(row).join('')}</tbody></table></div></details></div>`;
}

/* ------------------------------------------------------------------ retention */
function renderRetention() {
  const m = state.model, met = m.metrics, ret = m.retention || {}, sl = m.suppression_list;
  const days = (met.complaints_by_day||[]).map(addExpiry);
  const today = isoDay(Date.now());
  const soon = n => days.filter(d => d.expires >= today && T(d.expires) - T(today) <= n*DAY).reduce((a,b)=>a+b.count,0);
  const life = `<div class="life">
    <div class="lc"><div class="lk">CloudWatch <code>Complaint</code> count</div><div class="lv">${ret.cloudwatch_days||455} days</div>
      <div class="ld">Oldest recorded day ages out <b>${fmtDate(ret.oldest_expires)}</b> (${relDays(ret.oldest_expires)}); the newest on <b>${fmtDate(ret.newest_expires)}</b>. ${plural(soon(30),'complaint')} age${soon(30)===1?'s':''} out in the next 30 days, ${soon(90)} in the next 90.</div></div>
    <div class="lc"><div class="lk">SES account suppression list</div><div class="lv">Never</div>
      <div class="ld">Stays until you remove it${sl?` (<b>${fmtInt(sl.complaints)}</b> complaint entries of ${fmtInt(sl.total)}${sl.oldest_complaint?`, oldest ${esc(sl.oldest_complaint.slice(0,10))}`:''})`:''}. The only exception: SES deletes entries after 90 days if account sending is paused.</div></div>
    <div class="lc"><div class="lk">Reputation complaint rate</div><div class="lv">Dilutes</div>
      <div class="ld">AWS scores against a “representative volume” that follows how you send. Old complaints fade as volume grows rather than expiring on a date.</div></div>
  </div>`;
  return `${life}
    <div class="chartcard" style="margin-top:14px">
      <div class="ch-head"><div><div class="ch-title">When each recorded complaint ages out of CloudWatch</div>
        <div class="ch-sub">Each day appears twice: when the complaint was recorded and, ${ret.cloudwatch_days||455} days later, when it leaves the metric.</div></div>
        <div class="legendrow"><span class="k"><span class="sw disc" style="background:var(--s1)"></span>recorded</span><span class="k"><span class="sw ring" style="border-color:var(--s1)"></span>ages out</span><span class="k"><span class="sw line" style="background:var(--ink2)"></span>today</span></div></div>
      <div class="chart-host" id="expiryChart" style="min-height:110px"></div>
    </div>`;
}
function drawExpiry() {
  const host = document.getElementById('expiryChart'); if (!host) return;
  const days = (state.model.metrics.complaints_by_day||[]).map(addExpiry);
  if (!days.length) { host.innerHTML = '<div class="sub" style="padding:20px 6px">No recorded complaints.</div>'; return; }
  const W = Math.max(200, host.clientWidth), narrow = W < 560;
  const padL = narrow ? 70 : 84, padR = 18, H = 118, r1 = 30, r2 = 72, b = 96;
  const now = Date.now();
  const from = Math.min(...days.map(d=>T(d.date)), now), to = Math.max(...days.map(d=>T(d.expires)), now);
  const xs = t => padL + (t - from) / Math.max(to - from, 1) * (W - padL - padR);
  let g = '';
  for (const [y, label] of [[r1,'Recorded'],[r2,'Ages out']]) {
    g += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" class="k-grid"/>`;
    g += `<text x="${padL-12}" y="${y+4}" text-anchor="end" font-size="11" class="t-ink2">${label}</text>`;
  }
  const tx = xs(now);
  g += `<line x1="${tx}" x2="${tx}" y1="12" y2="${b-8}" class="k-ink" stroke-width="1.5"/>`;
  g += `<text x="${tx}" y="9" text-anchor="middle" font-size="10.5" font-weight="600" class="t-ink halo">today</text>`;
  // days closer than a dot's width merge into one cluster so marks never overlap
  const clusters = [];
  for (const d of days.slice().sort((a,b)=>T(a.date)-T(b.date))) {
    const x = xs(T(d.date)), last = clusters[clusters.length-1];
    if (last && x - last.x0 < 14) { last.items.push(d); last.n += d.count; last.x = (last.x0 + x) / 2; }
    else clusters.push({x0:x, x, n:d.count, items:[d]});
  }
  for (const c of clusters) {
    const a = c.items[0], z = c.items[c.items.length-1];
    const x1 = c.x, x2 = (xs(T(a.expires)) + xs(T(z.expires))) / 2;
    const rr = Math.min(9, 4 + Math.sqrt(c.n) * 1.6);
    const span = a === z ? fmtDate(a.date) : `${fmtDate(a.date)} – ${fmtDate(z.date)}`;
    const ages = a === z ? `ages out ${fmtDate(a.expires)} · ${relDays(a.expires)}` : `ages out ${fmtDate(a.expires)} – ${fmtDate(z.expires)}`;
    g += `<circle cx="${x1.toFixed(1)}" cy="${r1}" r="${rr.toFixed(1)}" class="c-s1 k-surf" stroke-width="2"/>`;
    g += `<circle cx="${x2.toFixed(1)}" cy="${r2}" r="${rr.toFixed(1)}" fill="var(--card)" class="k-s1" stroke-width="2"/>`;
    if (c.n > 1 && rr >= 6) g += `<text x="${x1.toFixed(1)}" y="${r1-rr-5}" text-anchor="middle" font-size="10" class="t-ink2 halo">${c.n}</text>`;
    const tt = tipAttrs(span, plural(c.n,'complaint'), ages);
    g += `<circle cx="${x1.toFixed(1)}" cy="${r1}" r="12" class="hit" style="cursor:default" tabindex="0" ${tt}/>`;
    g += `<circle cx="${x2.toFixed(1)}" cy="${r2}" r="12" class="hit" style="cursor:default" ${tt}/>`;
  }
  g += `<line x1="${padL}" x2="${W-padR}" y1="${b}" y2="${b}" class="k-axis"/>`;
  const yearTicks = []; for (let y = new Date(from).getUTCFullYear(); y <= new Date(to).getUTCFullYear() + 1; y++) yearTicks.push(Date.UTC(y,0,1));
  const halfTicks = yearTicks.flatMap(t=>[t, Date.UTC(new Date(t).getUTCFullYear(),6,1)]).filter(t=>t>from && t<to);
  for (const t of halfTicks) {
    const x = xs(t), d = new Date(t);
    g += `<line x1="${x}" x2="${x}" y1="${b}" y2="${b+4}" class="k-axis"/>`;
    g += `<text x="${x}" y="${b+17}" text-anchor="middle" font-size="10.5" class="t-mut">${d.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})} ’${String(d.getUTCFullYear()).slice(2)}</text>`;
  }
  host.innerHTML = `<svg width="${W}" height="${H+6}" viewBox="0 0 ${W} ${H+6}" role="img" aria-label="${days.length} complaint days recorded between ${days[0].date} and ${days[days.length-1].date}; they age out between ${days[0].expires} and ${days[days.length-1].expires}.">${g}</svg>`;
}

function renderMethodology() {
  const met = state.model.metrics, ret = state.model.retention || {}, q = state.model.complaint_queue, errs = state.model.errors||[];
  const errBox = errs.length ? `<div class="box errbox"><b>Collector warnings (${errs.length}).</b> These sources failed this cycle. The rest of the report still rendered.
    <ul class="errlist">${errs.map(e=>`<li><code>${esc(e.section)}</code> — ${esc(e.error)}</li>`).join('')}</ul></div>` : '';
  return `${errBox}<details class="more" style="margin-top:18px" ${errs.length?'open':''}><summary>Data sources, methodology and caveats</summary>
    <div class="tablewrap" style="max-height:none;margin-top:10px"><table>
      <thead><tr><th>Source</th><th>What it provides</th><th>Coverage</th></tr></thead><tbody>
      <tr><td>CloudWatch <code>AWS/SES</code> (${esc(state.model.meta.region)})</td><td>Complaint/Send/Bounce counts, per-config-set counts, <code>Reputation.ComplaintRate</code></td><td>${met.window.days} days (${met.window.retention_start} → ${met.window.retention_end})</td></tr>
      <tr><td>SES v2 API</td><td>Enforcement, suppression list, quota, identities (DKIM, MAIL FROM), config sets, event destinations</td><td>point-in-time</td></tr>
      <tr><td>SNS + SQS</td><td>Feedback topic topology, subscribers, DLQ state</td><td>point-in-time</td></tr>
      <tr><td>DynamoDB application stores</td><td>Individual complainant addresses and diagnostics</td><td>as retained by each app</td></tr>
      <tr><td>CloudWatch Logs Insights</td><td>structured <code>event=feedback_unattributed</code> events</td><td>7-day retention only</td></tr>
    </tbody></table></div>
    <div class="box note"><b>Caveats.</b> (1) CloudWatch keeps the <code>Complaint</code> count metric for only ${ret.cloudwatch_days||455} days, so totals cover that window. Earlier activity can only be inferred from the rolling rate.
    (2) Per-recipient detail exists only where an application saved it. (3) CloudWatch Logs keeps 7 days, so older unattributed complaints cannot be fully recovered.
    (4) The <code>${esc(q?q.name:'complaint')}</code> SQS dead-letter store is governance-controlled, and this report deliberately does not read its message bodies.
    (5) Expiry rules come from the AWS SES and CloudWatch docs: suppression-list entries do not expire on their own, and CloudWatch keeps 1-hour data points for 455 days.
    (6) Daily complaint buckets start at local midnight, so dates stay stable across refreshes. Tools that bucket on a different schedule may put the same complaint on the next or previous day.</div>
  </details>`;
}

/* ------------------------------------------------------------------ assemble */
function render() {
  if (!state.model) return;
  renderMeta();
  const app = document.getElementById('app');
  const cs = state.model.config_set_complaints || [];
  if (state.source !== 'all' && !cs.some(c=>c.config_set===state.source)) state.source = 'all';
  const gaps = coverageRows().filter(c=>!c.routes).length;
  app.innerHTML =
    renderHero() + renderAttention() + renderDelta() +
    `<section class="reveal" style="--i:3">${sechead('trend','01 · Volume','Complaint trend','The rolling rate against AWS’s line, and the days complaints actually landed, on one time axis.')}<div id="trendSection"></div></section>` +
    `<section>${sechead('attribution','02 · Attribution','Where the complaints came from','Compares the account-wide CloudWatch count with the recipient records each store kept, and separates real complainants from simulator tests.')}${renderAttribution()}</section>` +
    `<section>${sechead('providers','03 · Providers','Mailbox providers', 'Complaint, bounce and engagement rates per mailbox provider, identity and config set, computed from your own ledger. VDM stays off and costs nothing.')}<div id="providersSection"></div></section>` +
    `<section>${sechead('records','04 · Records','Who complained')}${renderRecords()}</section>` +
    `<section>${sechead('coverage','05 · Pipeline',`Feedback routing &amp; suppression coverage`, 'Send paths with no COMPLAINT/BOUNCE destination never notify your handler, so complaints there go unseen by ops. Ranked by exposure.', gaps?`<span class="tag warn">${icon('alert')}${plural(gaps,'gap')}</span>`:`<span class="tag ok">${icon('check')}fully routed</span>`)}${renderCoverage()}</section>` +
    `<section>${sechead('infra','06 · Account','Posture &amp; infrastructure')}${renderInfra()}</section>` +
    `<section>${sechead('retention','07 · Retention','When complaints expire','The answer depends on which record you mean.')}${renderRetention()}${renderMethodology()}</section>`;

  // nav badge for open items
  const nav = document.querySelector('#secnav a[href="#overview"]');
  const urgent = attentionItems().filter(i=>i.sev!=='info').length;
  nav.innerHTML = `Overview${urgent?`<span class="alertcount" aria-label="${urgent} items to review">${urgent}</span>`:''}`;

  mountTrend();
  mountProviders();
  drawExpiry();
  // mount deferred interactive tables (search/sort) after HTML is in place
  const records = state.model.complaint_records || [];
  document.getElementById('recordTable').append(makeTable({
    columns:[
      {key:'email',title:'Recipient address',cls:'mono',hint:'The address that complained; “test” marks an AWS mailbox-simulator address',
        render:r=>esc(r.email)+(r.simulator?' <span class="tag warn" title="AWS SES mailbox-simulator address — synthetic test feedback, not a real subscriber">test</span>':''),
        searchValue:r=>`${r.email||''} ${r.simulator?'test':''}`},
      {key:'store',title:'Store',hint:'Where the record is retained, and which pipeline reported it',
        render:r=>`${esc(r.store||'—')}${r.source?`<div class="cell-sub">via ${esc(r.source)}</div>`:''}`,
        searchValue:r=>`${r.store||''} ${r.source||''}`},
      {key:'feedback',title:'Feedback',hint:'ARF feedback type / diagnostic, and the SES event type where recorded',
        render:r=>`${r.detail?esc(r.detail):'<span class="muted">—</span>'}${r.event_type?`<div class="cell-sub">${esc(r.event_type)} event</div>`:''}`,
        sortValue:r=>r.detail||'',
        searchValue:r=>`${r.event_type||''} ${r.detail||''}`},
      {key:'sending_identity',title:'Sending identity',
        render:r=>r.sending_identity?`<span class="mono">${esc(r.sending_identity)}</span>`:'<span class="muted">—</span>'},
      {key:'seen',title:'Seen',hint:'First and last time this record was seen by its store',
        sortValue:r=>r.last_seen||r.first_seen||'',
        render:r=>{ const f=r.first_seen?fmtTs(r.first_seen):null, l=r.last_seen?fmtTs(r.last_seen):null;
          if(!f&&!l) return '<span class="muted">—</span>';
          if(!l||f===l) return `<span title="first and last seen at the same time">${esc(f||l)}</span>`;
          return `${esc(f)}<div class="cell-sub">→ last ${esc(l)}</div>`; },
        searchValue:r=>`${fmtTs(r.first_seen)} ${fmtTs(r.last_seen)}`},
      {key:'hits',title:'Hits',type:'num',cls:'num',hint:'How many times this address was suppressed',
        render:r=>(r.hits===null||r.hits===undefined)?'<span class="muted">—</span>':fmtInt(r.hits)},
    ], rows:records,
    csv:'recipient-records',
    csvColumns:[
      {key:'email',title:'Recipient address'},{key:'simulator',title:'Mailbox simulator',value:r=>r.simulator?'yes':''},
      {key:'store',title:'Store'},{key:'source',title:'Source'},
      {key:'sending_identity',title:'Sending identity'},{key:'event_type',title:'Event'},
      {key:'detail',title:'Feedback detail'},
      {key:'first_seen',title:'First seen'},{key:'last_seen',title:'Last seen'},{key:'hits',title:'Hits'},
    ],
    filters:[
      {key:'store',label:'All stores',value:r=>r.store},
      {key:'simulator',label:'All records',value:r=>r.simulator?'mailbox-simulator (test)':'real complainants'},
    ],
  }));
  const c = state.model.complainants;
  document.getElementById('complainantTable').append(makeTable({
    columns:[
      {key:'email',title:'Recipient address',cls:'mono'},
      {key:'arf_provider',title:'ARF feedback provider'},
      {key:'recorded_at',title:'Recorded at',render:r=>esc(fmtTs(r.recorded_at)),type:'num'},
      {key:'bounce_count',title:'Bounce count',type:'num',cls:'num'},
      {key:'bouncing',title:'Bouncing flag',render:r=>r.bouncing?'<span class="bad">true</span>':'<span class="ok">false</span>'},
      {key:'auth_provider',title:'Auth provider'},
    ], rows:c, height:320,
    filters:[{key:'arf_provider',label:'All ARF providers',value:r=>r.arf_provider}],
  }));
  const un = state.model.unattributed || [];
  if (un.length) document.getElementById('unattrTable').append(makeTable({columns:[
      {key:'domain',title:'Recipient domain',cls:'mono'},{key:'feedback_type',title:'Feedback type'},{key:'events',title:'Events',type:'num',cls:'num'}],
    rows:un, search:false, csv:'unattributed-domains'}));
  const cs2 = state.model.config_sets;
  document.getElementById('csTable').append(makeTable({
    columns:[
      {key:'name',title:'Config set'},
      {key:'event_types',title:'Event types',render:r=>esc((r.event_types||[]).join(', ')||'—')},
      {key:'destinations',title:'Feedback destination',render:r=>(r.destinations||[]).map(d=>{
        const parts=[]; if(d.sns)parts.push(esc(d.sns)); if(d.cloudwatch)parts.push('CloudWatch: '+esc(d.cloudwatch.join(', '))); if(d.firehose)parts.push('Firehose');
        return parts.join('<br>')||'<span class="muted">no event destination</span>';}).join('<br>')||'<span class="muted">no event destination</span>'},
      {key:'forwards_feedback',title:'Routes feedback',render:r=>r.forwards_feedback?'<span class="ok">yes</span>':'<span class="warn">no</span>'},
    ], rows:cs2, height:360,
    filters:[{key:'forwards_feedback',label:'All config sets',value:r=>r.forwards_feedback?'routes feedback':'no feedback routing'}],
  }));
  const idfb = state.model.identity_feedback || [];
  document.getElementById('idfbTable').append(makeTable({
    columns:[
      {key:'identity',title:'Sending identity',cls:'mono'},
      {key:'complaint_topic',title:'Complaint topic',render:r=>r.complaint_topic?`<span class="mono">${esc(r.complaint_topic)}</span>`:'<span class="muted">—</span>'},
      {key:'bounce_topic',title:'Bounce topic',render:r=>r.bounce_topic?`<span class="mono">${esc(r.bounce_topic)}</span>`:'<span class="muted">—</span>'},
      {key:'forwarding_enabled',title:'Email forwarding',render:r=>r.forwarding_enabled?'yes':'<span class="muted">no</span>'},
    ], rows:idfb, height:300, search:false,
    filters:[{key:'complaint_topic',label:'All identities',value:r=>r.complaint_topic||'(none)'}],
  }));
  const sns = state.model.sns_topics.filter(t=>t.subscribers.some(s=>s.protocol==='https'||s.protocol==='lambda'));
  document.getElementById('snsTable').append(makeTable({
    columns:[{key:'name',title:'Topic'},
      {key:'subscribers',title:'Subscribers',render:r=>(r.subscribers||[]).map(s=>`<span class="mono">${esc(s.protocol)} → ${esc(s.endpoint)}</span>`).join('<br>')||'<span class="muted">none</span>'}],
    rows:sns, height:300,
  }));
  const id = state.model.identities;
  document.getElementById('idTable').append(makeTable({
    columns:[
      {key:'name',title:'Identity',cls:'mono'},
      {key:'type',title:'Type'},
      {key:'dkim_status',title:'DKIM status',render:r=>r.dkim_status==='SUCCESS'?`<span class="ok">${esc(r.dkim_status)}</span>`:(r.dkim_status==='FAILED'?`<span class="bad">${esc(r.dkim_status)}</span>`:esc(r.dkim_status||'—'))},
      {key:'sending',title:'Sending',render:r=>r.sending?'yes':'no'},
    ], rows:id.rows||[], height:340,
    filters:[{key:'dkim_status',label:'All statuses',value:r=>r.dkim_status},{key:'type',label:'All types',value:r=>r.type}],
  }));
  observeSections();
}

/* ------------------------------------------------------------------ nav + resize */
let secObserver = null;
function observeSections() {
  const nav = document.getElementById('secnav');
  const links = [...nav.querySelectorAll('a')];
  secObserver?.disconnect();
  if (!window.IntersectionObserver) return;
  secObserver = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) {
      links.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + e.target.id)));
    }
  }, {rootMargin:'-30% 0px -60% 0px'});
  for (const a of links) { const t = document.querySelector(a.getAttribute('href')); if (t) secObserver.observe(t); }
}
window.addEventListener('scroll', () => {
  const nav = document.getElementById('secnav');
  nav.classList.toggle('stuck', nav.getBoundingClientRect().top <= 0 && window.scrollY > 40);
}, {passive:true});
let resizeH = null, lastW = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeH);
  resizeH = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (state.model) { drawTrend(); drawExpiry(); } } }, 120);
});

/* ------------------------------------------------------------------ theme */
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function paintThemeBtn() {
  const b = document.getElementById('themebtn');
  const t = currentTheme();
  b.innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
  b.setAttribute('aria-label', `Switch to ${t === 'dark' ? 'light' : 'dark'} theme`);
  b.title = b.getAttribute('aria-label');
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('sesreport-theme', next); } catch (e) {}
  paintThemeBtn();
}

/* ------------------------------------------------------------------ actions */
function setRange(v){ state.range=v; mountTrend(); mountProviders(); document.querySelector(`[data-range="${v}"]`)?.focus(); }
function setSource(v){ state.source=v; mountTrend(); document.querySelector(`[data-source="${CSS.escape(v)}"]`)?.focus(); }

async function doRefresh() {
  const btn = document.getElementById('refresh');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Refreshing…';
  document.getElementById('app').classList.add('loading');
  try {
    const r = await fetch('/api/refresh', {method:'POST', headers:{'X-Requested-With':'sesreport'}});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    toast('Refresh started — re-querying AWS…');
    await pollUntilDone();
  } catch(e) { toast('Refresh failed: '+e); }
  document.getElementById('app').classList.remove('loading');
  btn.disabled = false; btn.innerHTML = icon('refresh') + ' Refresh';
}

function pollUntilDone() {
  return new Promise(resolve => {
    const tick = async () => {
      let s;
      try { s = await (await fetch('/api/status')).json(); }
      catch(e) { return resolve(); }
      state.status = s;
      updateFresh(s);
      if (!s.refreshing) {
        if (s.last_error) toast('Refresh error: '+s.last_error, 6000);
        else toast('Report refreshed.');
        await load();
        return resolve();
      }
      setTimeout(tick, 1500);
    };
    tick();
  });
}

function updateFresh(s) {
  const f = document.getElementById('freshtext');
  const dot = document.querySelector('#freshtick .dot');
  if (!s || !s.last_finished) { f.textContent = 'awaiting first collection…'; return; }
  const ageMin = Math.floor((Date.now() - new Date(s.last_finished).getTime())/60000);
  const min = Math.floor(s.refresh_interval_s/60);
  f.textContent = s.refreshing ? 'refreshing…' : `updated ${ageMin<1?'just now':ageMin+'m ago'} · auto every ${min>=60?(min/60)+'h':min+'m'}`;
  if (dot) dot.style.background = s.last_error ? 'var(--red)' : 'var(--ok)';
}

let loading = false;
async function load() {
  if (loading) return; loading = true;
  try {
    const r = await fetch('/api/report');
    if (r.status === 202) { setTimeout(load, 2500); return; }
    state.model = await r.json();
    try { state.history = (await (await fetch('/api/history')).json()).entries || []; } catch(e) { state.history = []; }
    render();
    updateFresh(state.status || (await (await fetch('/api/status')).json()));
  } catch(e) { console.error(e); } finally { loading = false; }
}

(function init(){
  document.getElementById('brandmark').innerHTML = icon('wave');
  document.getElementById('refreshicon').innerHTML = '';
  document.getElementById('refresh').innerHTML = icon('refresh') + ' Refresh';
  paintThemeBtn();
  document.getElementById('themebtn').addEventListener('click', toggleTheme);
  window.matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', paintThemeBtn);
  lastW = window.innerWidth;
  load();
  setInterval(async ()=>{ try { state.status = await (await fetch('/api/status')).json(); updateFresh(state.status); } catch(e){} }, 30000);
})();
</script>
