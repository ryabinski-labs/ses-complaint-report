version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # wait a week so a compromised release can be caught first; security updates are immediate
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # wait a week so a compromised release can be caught first; security updates are immediate
    cooldown:
      default-days: 7
