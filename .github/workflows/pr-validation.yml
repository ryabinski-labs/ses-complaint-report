name: PR validation

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no secrets are exposed to PR code.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: OSS compliance checks
        run: python3 .github/scripts/check_compliance.py

      - name: OSS readiness audit gate
        run: python3 .github/scripts/oss_audit_gate.py

      - name: Package smoke test (build)
        run: uv build

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install UI test dependencies
        working-directory: tests/ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      - name: UI end-to-end tests (demo mode)
        working-directory: tests/ui
        run: npx playwright test

