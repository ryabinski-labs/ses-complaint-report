name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign provenance with Sigstore
      attestations: write # store the attestation on GitHub
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # sdist + wheel from the tagged tree; the tag must match pyproject's version.
      - name: Build sdist and wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          [ "v${version}" = "$TAG" ] || { echo "tag $TAG does not match pyproject version $version" >&2; exit 1; }
          uv build --out-dir dist

      - name: Generate SLSA provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The bundle is JSON lines of Sigstore-signed in-toto SLSA provenance. Verify with:
      # gh attestation verify <asset> --repo OWNER/REPO --bundle <tag>.intoto.jsonl
      - name: Create draft release, attach assets, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/${GITHUB_REPOSITORY#*/}-${TAG}.intoto.jsonl"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
